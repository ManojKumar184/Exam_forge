name: ExamForge CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/examforge_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Backend syntax checks
        shell: bash
        run: find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Backend tests
        run: npm test --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend typecheck
        run: npm run typecheck --prefix frontend
      - name: Frontend production build
        run: npm run build --prefix frontend
      - name: Backend production dependency audit
        run: npm audit --prefix backend --omit=dev --audit-level=high
      - name: Frontend dependency audit
        run: npm audit --prefix frontend --audit-level=high
